<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}数据库智能诊断平台{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="app-layout">
    <button class="mobile-menu-btn" id="mobile-menu-btn" onclick="document.querySelector('.sidebar').classList.toggle('open')">
        <span></span><span></span><span></span>
    </button>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <span class="brand-mark">DB</span>
            <span class="brand-text">DBA Diagnosis</span>
        </div>
        <nav class="sidebar-nav">
            <a href="{{ url_for('main.index') }}" class="nav-item {% if request.endpoint == 'main.index' %}active{% endif %}">
                <span class="nav-icon">&#128202;</span>
                <span>Oracle AWR</span>
            </a>
            <a href="{{ url_for('main.history') }}" class="nav-item {% if request.endpoint in ('main.history', 'main.view_history', 'main.compare_select', 'main.compare_result') %}active{% endif %}">
                <span class="nav-icon">&#128221;</span>
                <span>历史记录</span>
            </a>
            <a href="{{ url_for('main.trends') }}" class="nav-item {% if request.endpoint == 'main.trends' %}active{% endif %}">
                <span class="nav-icon">&#128200;</span>
                <span>趋势分析</span>
            </a>

            {# 系统设置 — 带子菜单 #}
            {% set settings_active = request.endpoint in ('main.settings', 'main.settings_knowledge', 'main.settings_io') or request.endpoint == 'main.export_knowledge' %}
            <div class="nav-group {% if settings_active %}open{% endif %}">
                <a href="{{ url_for('main.settings') }}" class="nav-item {% if settings_active %}active{% endif %}" onclick="this.closest('.nav-group').classList.toggle('open')">
                    <span class="nav-icon">&#9881;</span>
                    <span>系统设置</span>
                    <span class="nav-arrow">&#9662;</span>
                </a>
                <div class="nav-children">
                    <a href="{{ url_for('main.settings') }}" class="nav-sub-item {% if request.endpoint == 'main.settings' %}active{% endif %}">
                        <span>LLM 配置</span>
                    </a>
                    <a href="{{ url_for('main.settings_knowledge') }}" class="nav-sub-item {% if request.endpoint == 'main.settings_knowledge' %}active{% endif %}">
                        <span>知识管理</span>
                    </a>
                    <a href="{{ url_for('main.settings_io') }}" class="nav-sub-item {% if request.endpoint in ('main.settings_io', 'main.export_knowledge') %}active{% endif %}">
                        <span>导出 / 导入</span>
                    </a>
                </div>
            </div>
        </nav>
        <div class="sidebar-footer">
            <span class="sidebar-version">v1.0</span>
        </div>
    </aside>
    <div class="main-wrapper">
        {% block content %}{% endblock %}
    </div>
    <script>
    document.addEventListener('click', function(e) {
        const sidebar = document.getElementById('sidebar');
        const btn = document.getElementById('mobile-menu-btn');
        if (sidebar && sidebar.classList.contains('open') && !sidebar.contains(e.target) && !btn.contains(e.target)) {
            sidebar.classList.remove('open');
        }
    });
    </script>
</body>
</html>
