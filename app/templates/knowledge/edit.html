{% extends "base.html" %}
{% block title %}{{ '编辑' if entry else '添加' }}知识条目{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">{{ '编辑' if entry else '添加' }}知识条目</h1>
  </div>
  <a href="{{ url_for('knowledge.list_entries') }}" class="btn btn-secondary">返回</a>
</div>

<div class="card" style="max-width:640px;">
  <form method="POST">
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">分类</label>
        <select name="category" class="form-select">
          {% for cat in ['wait_event', 'sql_pattern', 'io_pattern', 'memory', 'general'] %}
          <option value="{{ cat }}" {% if entry and entry.category == cat %}selected{% endif %}>{{ cat }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">严重级别</label>
        <select name="severity" class="form-select">
          {% for sev in ['low', 'medium', 'high', 'critical'] %}
          <option value="{{ sev }}" {% if entry and entry.severity == sev %}selected{% endif %}>{{ sev }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">标题</label>
      <input type="text" name="title" class="form-input" value="{{ entry.title if entry else '' }}" required>
    </div>
    <div class="form-group">
      <label class="form-label">匹配模式 (正则表达式)</label>
      <input type="text" name="pattern" class="form-input" value="{{ entry.pattern if entry else '' }}" placeholder="例: db file sequential read">
    </div>
    <div class="form-group">
      <label class="form-label">描述</label>
      <textarea name="description" class="form-textarea" required>{{ entry.description if entry else '' }}</textarea>
    </div>
    <div class="form-group">
      <label class="form-label">解决方案</label>
      <textarea name="solution" class="form-textarea" style="min-height:150px;">{{ entry.solution if entry else '' }}</textarea>
    </div>
    {% if entry %}
    <div class="form-group form-checkbox">
      <input type="checkbox" name="is_active" id="is_active" {% if entry.is_active %}checked{% endif %}>
      <label for="is_active" style="font-size:13px;">启用此规则</label>
    </div>
    {% endif %}
    <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;">保存</button>
  </form>
</div>
{% endblock %}
