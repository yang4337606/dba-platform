{% extends "base.html" %}
{% block title %}{{ '编辑' if entry else '添加' }}知识条目{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">{{ '编辑' if entry else '添加' }}知识条目</h1>
  </div>
  <a href="{{ url_for('knowledge.list_entries') }}" class="btn btn-secondary">返回</a>
</div>

<div class="card" style="max-width:640px;">
  <form method="POST">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">分类</label>
        <select name="category" class="form-select">
          {% for cat in ['wait_event', 'sql', 'io', 'memory', 'redo', 'rac', 'parse', 'general'] %}
          <option value="{{ cat }}" {% if entry and entry.category == cat %}selected{% endif %}>{{ cat }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">严重级别</label>
        <select name="severity" class="form-select">
          {% for sev in ['low', 'medium', 'high', 'critical'] %}
          <option value="{{ sev }}" {% if entry and entry.severity == sev %}selected{% endif %}>{{ sev }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">规则名称</label>
      <input type="text" name="name" class="form-input" value="{{ entry.name if entry else '' }}" required>
    </div>
    <div class="form-group">
      <label class="form-label">条件 (JSON)</label>
      <textarea name="conditions_json" class="form-textarea" placeholder='[{"metric": "pct_db_time", "op": ">", "value": 30}]'>{{ entry.conditions_json if entry else '[{"metric": "", "op": ">", "value": 0}]' }}</textarea>
    </div>
    <div class="form-group">
      <label class="form-label">根因分析</label>
      <textarea name="root_cause" class="form-textarea" required>{{ entry.root_cause if entry else '' }}</textarea>
    </div>
    <div class="form-group">
      <label class="form-label">解决方案</label>
      <textarea name="solution" class="form-textarea" style="min-height:150px;">{{ entry.solution if entry else '' }}</textarea>
    </div>
    {% if entry %}
    <div class="form-group">
      <label class="form-label">状态</label>
      <select name="status" class="form-select">
        {% for st in ['candidate', 'observed', 'active', 'stale', 'rejected'] %}
        <option value="{{ st }}" {% if entry.status == st %}selected{% endif %}>{{ st }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group form-checkbox">
      <input type="checkbox" name="is_active" id="is_active" {% if entry.is_active %}checked{% endif %}>
      <label for="is_active" style="font-size:13px;">启用此规则</label>
    </div>
    {% endif %}
    <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;">保存</button>
  </form>
</div>
{% endblock %}
