{% extends "base.html" %}
{% block title %}{{ '编辑' if user else '添加' }}用户{% endblock %}
{% block content %}
<div class="page-header">
  <div><h1 class="page-title">{{ '编辑' if user else '添加' }}用户</h1></div>
  <a href="{{ url_for('admin.users') }}" class="btn btn-secondary">返回</a>
</div>

<div class="card" style="max-width:480px;">
  <form method="POST">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    {% if not user %}
    <div class="form-group">
      <label class="form-label">用户名</label>
      <input type="text" name="username" class="form-input" required>
    </div>
    {% endif %}
    <div class="form-group">
      <label class="form-label">邮箱</label>
      <input type="email" name="email" class="form-input" value="{{ user.email if user else '' }}" required>
    </div>
    <div class="form-group">
      <label class="form-label">密码 {% if user %}(留空不修改){% endif %}</label>
      <input type="password" name="password" class="form-input" {% if not user %}required{% endif %}>
    </div>
    <div class="form-group">
      <label class="form-label">角色</label>
      <select name="role" class="form-select">
        {% for r in ['admin', 'analyst', 'viewer'] %}
        <option value="{{ r }}" {% if user and user.role == r %}selected{% endif %}>{{ r }}</option>
        {% endfor %}
      </select>
    </div>
    {% if user %}
    <div class="form-group form-checkbox">
      <input type="checkbox" name="is_active" id="is_active" {% if user.is_active_user %}checked{% endif %}>
      <label for="is_active" style="font-size:13px;">账户启用</label>
    </div>
    {% endif %}
    <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;">保存</button>
  </form>
</div>
{% endblock %}
