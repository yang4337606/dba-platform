{% extends "base.html" %}
{% block title %}{{ _('login_title') }}{% endblock %}
{% block content %}
<div class="login-container">
  <div class="login-box">
    <div class="login-title">{{ _('login_brand') }}</div>
    <div class="login-subtitle">{{ _('login_tagline') }}</div>
    <form method="POST">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label">{{ _('label_username') }}</label>
        <input type="text" name="username" class="form-input" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">{{ _('label_password') }}</label>
        <input type="password" name="password" class="form-input" required>
      </div>
      <div class="form-group form-checkbox">
        <input type="checkbox" name="remember" id="remember">
        <label for="remember" style="font-size:12px;color:var(--text-secondary)">{{ _('label_remember') }}</label>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;">{{ _('btn_login') }}</button>
    </form>
  </div>
</div>
{% endblock %}
