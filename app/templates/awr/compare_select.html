{% extends "base.html" %}
{% block title %}{{ _('compare_title') }}{% endblock %}
{% block content %}
<div class="page-header">
  <h1 class="page-title">{{ _('compare_heading') }}</h1>
  <a href="{{ url_for('awr.list_reports') }}" class="btn btn-secondary">{{ _('btn_back_list') }}</a>
</div>

<form method="POST" action="{{ url_for('awr.compare_reports') }}">
  <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px;">
    <div class="analysis-section">
      <div class="analysis-header">{{ _('label_baseline_report') }}</div>
      <div class="analysis-body">
        <select name="report_a" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;background:var(--bg-secondary);color:var(--text-primary);">
          <option value="">{{ _('placeholder_select_report') }}</option>
          {% for r in reports %}
          <option value="{{ r.id }}">#{{ r.id }} {{ r.title }} ({{ r.db_name or '' }} {{ r.snap_begin_time.strftime('%m-%d %H:%M') if r.snap_begin_time else '' }})</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="analysis-section">
      <div class="analysis-header">{{ _('label_compare_report') }}</div>
      <div class="analysis-body">
        <select name="report_b" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;background:var(--bg-secondary);color:var(--text-primary);">
          <option value="">{{ _('placeholder_select_report') }}</option>
          {% for r in reports %}
          <option value="{{ r.id }}">#{{ r.id }} {{ r.title }} ({{ r.db_name or '' }} {{ r.snap_begin_time.strftime('%m-%d %H:%M') if r.snap_begin_time else '' }})</option>
          {% endfor %}
        </select>
      </div>
    </div>
  </div>
  <button type="submit" class="btn btn-primary" style="width:100%;">{{ _('btn_start_compare') }}</button>
</form>
{% endblock %}
